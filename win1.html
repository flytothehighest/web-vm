<!doctype html>
<head>
<title>Microsoft Windows 1+ Windows2模拟器 | ReducedRadius的工具页面</title>
<meta name="keywords" content="网页虚拟机,在线虚拟机,windows1模拟器,windows2模拟器,虚拟机" >
<meta name="description" content="在网页上运行的小型虚拟机,运行的RAM(内存)最多为 2GB(本页面为Windows1,2模拟器,启动后选择进入系统)" >
<meta charset="utf-8">
<link rel="stylesheet" href="index.css">
<style>
    body{
        color:black
    }
</style>
<link rel="stylesheet" href="../global.css">
<script src="functions.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
        <meta name='apple-mobile-web-app-capable' content='yes' />
        <meta name="format-detection" content="telephone=no" />
<script src="libv86.js"></script>
<script>
"use strict";
setInterval(()=>{ 
    for (let i = 0; i < document.getElementsByTagName("span").length; i++) {
        if(parseFloat(document.getElementsByTagName("span")[i].style.width) > globalThis.width){
        globalThis.width = parseFloat(document.getElementsByTagName("span")[i].style.width);
        }else{
            document.getElementsByTagName("span")[i].style.width = globalThis.width+"px"
        }
    }
},30)
window.onload = function()
{
    var emulator = window.emulator = new V86({
        wasm_path: "v86.wasm",
        memory_size: 5*1024 * 1024,
        vga_memory_size: 160 * 1024,
        screen_container: document.getElementById("screen_container"),
        bios: {
            url: "bios/seabios.bin",
        },
        vga_bios: {
            url: "bios/vgabios.bin",
        },
        fda: {
            url: "images/win12.img",
        },
        fdb:{
            url:"images/1.44MB.img"
        },
        hdb:{
            buffer:new ArrayBuffer(1.44*1024*1024)
        },
        autostart: true,
    });
    emulator.bus.register("download-progress",function(l){
      if(l.lengthComputable&&(l.loaded/l.total) != 1){
         document.title = `已加载`+Math.round((l.loaded/l.total)*100)+`%`
      }else if(l.lengthComputable){
         document.title = `Windows 1和2模拟器| ReducedRadius的工具页面`
      }
    })
setTimeout(e =>{
    emulator.keyboard_send_text("3");
    emulator.keyboard_send_text("Y");
},900)
}

</script>

</head>
<body style="background-color: black;">
<div id="screen_container" style="display: block;width:100%;height: 100%;">
    <div style="white-space: pre; font-family: icomoon; text-indent: 3px;position: relative;padding: 0;width:100%;height: 100%;z-index: -99;"></div>
    <canvas style="display: none;" onclick="emulator.lock_mouse()" ></canvas>
</div>
<a style="color:white">附注：先按任意键，再按下1(进入Win 1.04)或2(进入Win 2.03)键，按下Y键进入系统(由于需要加载系统入内存，内存设定为5MB)</a><br />
<button onclick="location.replace('index.html')">返回主页面</button>
<button onclick="emulator.restart()">重启</button>
<button onclick="emulator.screen_go_fullscreen()">全屏使用</button>
<button onclick="emulator.stop()">暂停</button>
<button onclick="emulator.run()">继续使用</button>
<button onclick="emulator.keyboard_send_keys([13])">按下回车</button>
<button onclick="document.querySelector('canvas').style.filter = 'grayscale(1)'">黑白模式</button>
<button onclick="for(var c of [29, 56, 83, 157, 184, 211]){emulator.bus.send('keyboard-code',c)}">Ctrl-Alt-Del组合键</button>
<input type="number" id="key" placeholder="键入键代码"><button onclick="emulator.keyboard_send_keys([document.querySelector('#key').value])">键入</button>
<button onclick="var href = (emulator.screen_make_screenshot().src);
var a = document.createElement('a');
a.href=href;
a.download = '截图.png';
a.click()
">截图</button>
<span>放大倍数:</span>
<input type="number" max="3" min="0.1" step="0.1" onchange="if(this.value < 3)emulator.screen_adapter.set_scale(this.value,this.value)" value="1">
<input type="text" id="ms" placeholder="键入键盘字符"><button onclick="emulator.keyboard_send_text(document.querySelector('#ms').value);">键入</button><br />
<button onclick="(async function(){
    const l = await emulator.save_state();
    var z = new Blob([l]);
    const _a = document.createElement('a');
    _a.href = window.URL.createObjectURL(z);
    _a.download = 'state.bin';
    _a.click()
    })()">保存状态</button>
    <button onclick="
      var f = document.createElement('input');
      f.type= 'file';
      f.accept = '.bin';
      f.onchange= async function(){
        emulator.restore_state(await f.files[0].arrayBuffer())
      }
      f.click()
    ">加载状态</button>
        <button onclick="ReplaceDisk()">驱动器管理</button>
        <button onclick="checkDrive()">驱动器信息</button>
<script src="../global.js"></script>
<script>
    window.onerror = function(e){
      mdui.alert('很抱歉，运行时出现以下错误。'+e.toString()+'该错误可能不影响继续运行。',"出错了qwq")
    }
</script>
</body>

<!doctype html>
<head>
<title>Node OS(内含NodeJS) 模拟器| ReducedRadius的工具页面</title>
<meta content="网页虚拟机,在线虚拟机" name="keywords">
<meta name="description" content="在网页上运行的小型虚拟机,运行的RAM(内存)最多为 2GB,(本页面为Node OS模拟器)" >
<meta charset="utf-8">
<style>
    body{
        color:white;
        background-color: black;
    }
</style>
<script src="libv86.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
        <meta name='apple-mobile-web-app-capable' content='yes' />
        <meta name="format-detection" content="telephone=no" />
<link rel="stylesheet" href="../global.css">
<link rel="stylesheet" href="index.css">
<script src="../global.js"></script>
<script src="functions.js"></script>
<script>
"use strict";

window.onload = function()
{
    var emulator = window.emulator = new V86({
        wasm_path: "v86.wasm",
        memory_size: 128 * 1024 * 1024,
        vga_memory_size: 16* 1024 * 1024,
        screen_container: document.getElementById("screen_container"),
        bios: {
            url: "bios/seabios.bin",
        },
        vga_bios: {
            url: "bios/vgabios.bin",
        },
        bzimage:{
            url:"images/node-kernel.bin"
        },
        autostart: true,
        boot_order:0
    });
}
</script>
</head>
<body>
<div id="screen_container">
    <div style="white-space: pre; font: 14px monospace;border:  rgb(160, 159, 159) 1px solid;"></div>
    <canvas style="display: none"></canvas>
</div>
<button onclick="location.reload()">重启（刷新）</button>
<button onclick="emulator.stop()">暂停</button>
<button onclick="emulator.keyboard_send_keys([13])">按下回车</button>
<button onclick="emulator.run()">继续使用</button>
<button onclick="for(var c of [29, 56, 83, 157, 184, 211]){emulator.bus.send('keyboard-code',c)}">Ctrl-Alt-Del组合键</button>
<button onclick="var href = (emulator.screen_make_screenshot().src);
var a = document.createElement('a');
a.href=href;
a.download = '截图.png';
a.click()
">截图</button>
<span>放大倍数</span>
<input type="number" max="10" min="0.1" step="0.1" onchange="if(this.value < 3)emulator.screen_adapter.set_scale(this.value,this.value)" value="1">
<input type="text" id="ms" placeholder="键入键盘字符"><button onclick="emulator.keyboard_send_text(document.querySelector('#ms').value);">键入</button>
<input type="number" id="key" placeholder="键入键代码"><button onclick="emulator.keyboard_send_keys([document.querySelector('#key').value])">键入</button>
<button onclick="(async function(){
    const l = await emulator.save_state();
    var z = new Blob([l]);
    const _a = document.createElement('a');
    _a.href = window.URL.createObjectURL(z);
    _a.download = 'state.bin';
    _a.click()
    })()">保存状态</button>
    <button onclick="
      var f = document.createElement('input');
      f.type= 'file';
      f.accept = '.bin';
      f.onchange= async function(){
        emulator.restore_state(await f.files[0].arrayBuffer())
      }
      f.click()
    ">加载状态</button>
     <button onclick="ReplaceDisk()">驱动器管理</button>
     <button onclick="checkDrive()">驱动器信息</button>
    <button onclick="location.replace('index.html')">返回主页面</button>
</body>
